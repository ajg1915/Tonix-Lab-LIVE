<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:*">
<title>Tonix-Lab-LIVE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div id="healthBar" class="health hidden" role="status"></div>

  <section class="stage" id="stage">
    <div class="view" id="previewView">
      <div class="view-label" id="previewLabel">Preview</div>
      <div class="canvas-box" id="editBox">
        <div class="canvas" id="editCanvas">
          <img id="editImg" alt="Scene being edited">
          <div class="sel-layer" id="selLayer"></div>
        </div>
      </div>
    </div>
    <div class="transition-col hidden" id="transCol">
      <button id="takeBtn" class="btn take" type="button">Transition</button>
      <button id="cutBtn" class="btn" type="button">Cut</button>
    </div>
    <div class="view hidden" id="programView">
      <div class="view-label pgm">Program</div>
      <div class="canvas-box">
        <div class="canvas" id="pgmCanvas"><img id="pgmImg" alt="Program output"></div>
      </div>
    </div>
  </section>

  <section class="docks">
    <div class="dock">
      <div class="dock-title">Scenes</div>
      <ul class="list" id="sceneList" role="listbox" aria-label="Scenes"></ul>
      <div class="dock-tools">
        <button class="tool" id="sceneAdd" type="button" title="Add scene" aria-label="Add scene">+</button>
        <button class="tool" id="sceneRemove" type="button" title="Remove scene" aria-label="Remove scene">−</button>
        <button class="tool wide" id="sceneRename" type="button">Rename</button>
      </div>
    </div>

    <div class="dock">
      <div class="dock-title">Sources</div>
      <ul class="list" id="sourceList" role="listbox" aria-label="Sources"></ul>
      <div class="dock-tools">
        <button class="tool" id="srcAdd" type="button" title="Add source" aria-label="Add source">+</button>
        <button class="tool" id="srcRemove" type="button" title="Remove source" aria-label="Remove source">−</button>
        <button class="tool wide" id="srcProps" type="button">Properties</button>
        <button class="tool" id="srcUp" type="button" title="Move up" aria-label="Move up">▲</button>
        <button class="tool" id="srcDown" type="button" title="Move down" aria-label="Move down">▼</button>
      </div>
    </div>

    <div class="dock mixer-dock">
      <div class="dock-title">Audio Mixer</div>
      <div class="mixer" id="mixer"><p class="muted pad">Waiting for audio…</p></div>
    </div>

    <div class="dock">
      <div class="dock-title">Scene Transitions</div>
      <div class="dock-body">
        <label class="field"><span>Transition</span><select id="transSel"></select></label>
        <label class="field"><span>Duration (ms)</span><input id="durInput" type="number" min="50" max="20000" step="50" value="300"></label>
      </div>
    </div>

    <div class="dock">
      <div class="dock-title">Controls</div>
      <div class="dock-body controls">
        <button id="liveBtn" class="btn ctrl" type="button">Start Streaming</button>
        <button id="studioBtn" class="btn ctrl" type="button" aria-pressed="false">Studio Mode</button>
        <button id="perfBtn" class="btn ctrl" type="button" aria-pressed="false">Performance Mode</button>
        <button id="settingsBtn" class="btn ctrl" type="button">Settings</button>
      </div>
    </div>
  </section>

  <footer class="status">
    <span id="liveStatus" class="st-live">○ LIVE: 00:00:00</span>
    <span class="st-item">Stream: <b id="destLabel">not set</b></span>
    <span class="grow"></span>
    <span class="st-item" id="stLag" title="Frames the PC could not draw in time">Lag: <b id="statLag">0</b></span>
    <span class="st-item" id="stDrop">Dropped: <b id="statDrop">0</b></span>
    <span class="st-item" id="stRate"><b id="statRate">0</b> kb/s</span>
    <span class="st-item">CPU: <b id="statCpu">–</b></span>
    <span class="st-item"><b id="statFps">–</b> fps</span>
    <span class="st-item">Encoder: <b id="statEnc">–</b></span>
  </footer>
</div>

<div id="ctxMenu" class="ctx hidden" role="menu"></div>

<div id="overlay" class="overlay">
  <div class="overlay-box">
    <div class="brand">Tonix-Lab-LIVE</div>
    <p id="overlayMsg">Starting the engine…</p>
    <button id="overlayRetry" class="btn hidden" type="button">Try again</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script src="vendor/obs-ws.global.js"></script>
<script src="app.js"></script>
</body>
</html>
