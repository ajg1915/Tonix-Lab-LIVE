name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from build number
        shell: pwsh
        run: |
          $v = "0.1.${{ github.run_number }}"
          npm version $v --no-git-tag-version
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Download the OBS engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view --repo obsproject/obs-studio --json tagName,assets | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match 'Windows.*\.zip$' -and $_.name -notmatch 'arm64|ARM64|PDB|Debug|Installer' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows zip found in OBS release $($rel.tagName)" }
          Write-Host "Using OBS $($rel.tagName): $($asset.name)"
          gh release download $rel.tagName --repo obsproject/obs-studio --pattern $asset.name --dir obs-dl
          Expand-Archive "obs-dl/$($asset.name)" -DestinationPath obs-x
          $root = Get-ChildItem obs-x -Recurse -Filter obs64.exe | Select-Object -First 1
          if (-not $root) { throw "obs64.exe not found in the zip" }
          $obsRoot = $root.Directory.Parent.Parent.FullName
          Move-Item $obsRoot obs
          if (-not (Test-Path obs/bin/64bit/obs64.exe)) { throw "Unexpected OBS layout" }
          "OBS_VERSION=$($rel.tagName)" >> $env:GITHUB_ENV

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Tonix-Lab-LIVE ${{ env.APP_VERSION }}
          body: |
            Windows installer for Tonix-Lab-LIVE ${{ env.APP_VERSION }} (engine: OBS ${{ env.OBS_VERSION }}).
            Download the Setup .exe below and run it. If Windows SmartScreen appears, click "More info" then "Run anyway".
          files: dist/*.exe
